# Services: postgres, dbinit (runs once), api, worker (2 processes), tests (on demand).
# One Postgres server holds relay_db and target_db. They are separate databases,
# so no transaction can span both (CLAUDE.md, Architecture).

x-relay-env: &relay-env
  # Compose builds the connection strings from the .env values so each secret lives in one place.
  # A password containing @ : / ? # would need URL-encoding here.
  RELAY_DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/relay_db
  ADMIN_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
  # The worker logs in to the target as relay_migrator, a role with only the rights it needs.
  # dbinit creates that role with this password.
  TARGET_DB_DSN: postgresql://relay_migrator:${TARGET_MIGRATOR_PASSWORD:?set it in .env}@postgres:5432/target_db
  TARGET_MIGRATOR_PASSWORD: ${TARGET_MIGRATOR_PASSWORD:?set it in .env}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: relay_db
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume mounts the parent directory, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d relay_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates what is missing: target_db, the relay_migrator role, the relay schema, and the
  # target schema. Safe to run on every `up`: it never drops anything (only `--reset` does).
  dbinit:
    build: .
    command: ["python", "-m", "relay.dbinit"]
    environment: *relay-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *relay-env
    ports:
      - "8000:8000"
    depends_on:
      dbinit:
        condition: service_completed_successfully

  # Two worker processes drain the same queue (CLAUDE.md: "Workers (2+ processes)").
  # Each gets its own WORKER_ID by default: container host name plus process id.
  # They draft proposals (PENDING -> WAITING_FOR_APPROVAL) and run approved ones on target_db
  # (APPROVED -> SUCCEEDED or FAILED).
  worker:
    build: .
    init: true # forwards SIGTERM so `docker compose down` stops the worker promptly
    command: ["python", "-m", "relay.worker"]
    deploy:
      replicas: 2
    environment: *relay-env
    depends_on:
      dbinit:
        condition: service_completed_successfully

  # Not started by `docker compose up`. Run the suite with:  docker compose run --rm tests pytest
  tests:
    build: .
    profiles: ["test"]
    command: ["pytest"]
    environment: *relay-env
    volumes:
      # Mount the repo so test edits need no image rebuild.
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
